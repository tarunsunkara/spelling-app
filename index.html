<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Spelling Fun</title>

<!-- Inline Web App Manifest to enable the Install button -->
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Spelling%20Fun%22%2C%22short_name%22%3A%22Spelling%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fapi.iconify.design%2Fnoto%3Astar.svg%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 16px;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
    background: linear-gradient(135deg, #e0e7ff 0%, #fef3c7 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .app-card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 28px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
    padding: 20px;
    text-align: center;
  }
  .counter {
    font-size: 16px;
    font-weight: 700;
    color: #6366f1;
    margin-bottom: 6px;
  }
  .target-word {
    font-size: 44px;
    font-weight: 900;
    color: #1e1b4b;
    letter-spacing: 2px;
    margin: 8px 0;
    min-height: 55px;
  }
  .target-word.hidden {
    filter: blur(10px);
  }
  .spelled-slots {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 14px 0 20px 0;
    min-height: 48px;
  }
  .slot {
    width: 42px;
    height: 46px;
    border-bottom: 4px solid #6366f1;
    font-size: 28px;
    font-weight: 800;
    color: #4338ca;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    border-radius: 8px;
  }
  .letters-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 18px 0;
  }
  .letter-btn {
    width: 52px;
    height: 52px;
    font-size: 26px;
    font-weight: 800;
    border-radius: 14px;
    border: none;
    background: #4f46e5;
    color: white;
    box-shadow: 0 4px 0 #312e81;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .letter-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #312e81;
  }
  .letter-btn.used {
    visibility: hidden;
  }
  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .btn {
    flex: 1;
    padding: 14px 8px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 800;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .btn:active { transform: translateY(3px); box-shadow: none; }
  .btn-speak { background: #38bdf8; color: #082f49; }
  .btn-hide { background: #facc15; color: #713f12; }
  .btn-nav { background: #22c55e; color: white; }
  .btn-back { background: #94a3b8; color: white; }
  .celebrate {
    font-size: 20px;
    font-weight: 800;
    color: #16a34a;
    min-height: 28px;
    margin: 6px 0;
  }
</style>
</head>
<body>

<div class="app-card">
  <div class="counter" id="counter">Word 1 of 75</div>
  <div class="target-word" id="wordDisplay">Head</div>
  <div class="celebrate" id="msg"></div>

  <!-- Letter slots she fills in -->
  <div class="spelled-slots" id="slots"></div>

  <!-- Big tap buttons for her little fingers -->
  <div class="letters-grid" id="letterChoices"></div>

  <div class="action-row">
    <button class="btn btn-speak" onclick="speakWord()">🔊 Say Word</button>
    <button class="btn btn-hide" onclick="togglePeek()">👁️ Peek</button>
    <button class="btn btn-back" onclick="resetCurrent()">🔄 Retry</button>
  </div>

  <div class="action-row" style="margin-top: 12px;">
    <button class="btn btn-back" onclick="prevWord()">⬅ Back</button>
    <button class="btn btn-nav" onclick="nextWord()">Next Word ➡</button>
  </div>
</div>

<script>
const words = [
  "Head", "Eyes", "Ears", "Nose", "Neck", "Hands", "Arm", "Knee", "Legs", "Foot",
  "Skin", "Tongue", "Father", "Mother", "Brother", "Sister", "Uncle", "Aunt", "Cousins", "Grandfather",
  "Grandmother", "Family", "Big", "Small", "Joint", "Lion", "Tiger", "Elephant", "Bear", "Zebra",
  "Monkey", "Giraffe", "Deer", "Snake", "Fox", "Cow", "Duck", "Sheep", "Goat", "Horse",
  "Hen", "Cat", "Dog", "Parrot", "Fish", "Camel", "Pigeon", "Sparrow", "Peacock", "Crow",
  "Owl", "Eagle", "Insects", "Ant", "Butterfly", "Ladybird", "Honeybee", "Grasshopper", "Housefly", "Mosquito",
  "Bedbug", "Ship", "Boat", "Bike", "Car", "Van", "Bus", "Aeroplane", "Jet", "Jeep",
  "Wait", "Stop", "Go", "Metro", "Train"
];

let currentIndex = 0;
let currentInput = [];
let isHidden = false;

function setupWord() {
  const word = words[currentIndex].toUpperCase();
  currentInput = [];
  document.getElementById("counter").textContent = `Word ${currentIndex + 1} of ${words.length}`;
  document.getElementById("wordDisplay").textContent = words[currentIndex];
  document.getElementById("msg").textContent = "";
  
  if (isHidden) {
    document.getElementById("wordDisplay").classList.add("hidden");
  } else {
    document.getElementById("wordDisplay").classList.remove("hidden");
  }

  // Draw empty answer slots
  const slotsContainer = document.getElementById("slots");
  slotsContainer.innerHTML = "";
  for (let i = 0; i < word.length; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.id = "slot-" + i;
    slotsContainer.appendChild(slot);
  }

  // Scramble letters for tap buttons
  const letters = word.split('');
  const scrambled = [...letters].sort(() => Math.random() - 0.5);
  
  const choices = document.getElementById("letterChoices");
  choices.innerHTML = "";
  scrambled.forEach((char) => {
    const btn = document.createElement("button");
    btn.className = "letter-btn";
    btn.textContent = char;
    btn.onclick = () => tapLetter(char, btn);
    choices.appendChild(btn);
  });

  speakWord();
}

function tapLetter(char, btn) {
  const target = words[currentIndex].toUpperCase();
  const nextIdx = currentInput.length;

  if (nextIdx < target.length) {
    // Speak letter phonics sound
    speakPhonic(char);
    
    currentInput.push({ char, btn });
    document.getElementById("slot-" + nextIdx).textContent = char;
    btn.classList.add("used");

    if (currentInput.length === target.length) {
      checkResult();
    }
  }
}

function checkResult() {
  const target = words[currentIndex].toUpperCase();
  const typed = currentInput.map(i => i.char).join("");
  const msg = document.getElementById("msg");

  if (typed === target) {
    msg.textContent = "🎉 Super Star! You did it! 🌟";
    speakCheer();
    setTimeout(() => {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        setupWord();
      }
    }, 1800);
  } else {
    msg.textContent = "Try again!";
    setTimeout(resetCurrent, 800);
  }
}

function resetCurrent() {
  currentInput = [];
  const target = words[currentIndex].toUpperCase();
  for (let i = 0; i < target.length; i++) {
    const slot = document.getElementById("slot-" + i);
    if (slot) slot.textContent = "";
  }
  document.querySelectorAll(".letter-btn").forEach(b => b.classList.remove("used"));
  document.getElementById("msg").textContent = "";
}

function speakWord() {
  const utter = new SpeechSynthesisUtterance(words[currentIndex]);
  utter.rate = 0.8;
  utter.pitch = 1.1;
  window.speechSynthesis.speak(utter);
}

function speakPhonic(letter) {
  const utter = new SpeechSynthesisUtterance(letter);
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function speakCheer() {
  const utter = new SpeechSynthesisUtterance("Great job!");
  utter.rate = 0.9;
  utter.pitch = 1.2;
  window.speechSynthesis.speak(utter);
}

function togglePeek() {
  isHidden = !isHidden;
  document.getElementById("wordDisplay").classList.toggle("hidden", isHidden);
}

function nextWord() {
  if (currentIndex < words.length - 1) {
    currentIndex++;
    setupWord();
  }
}

function prevWord() {
  if (currentIndex > 0) {
    currentIndex--;
    setupWord();
  }
}

setupWord();
</script>
</body>
</html>
